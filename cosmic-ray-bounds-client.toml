[cosmic-ray]
module-path = "src/librus_client.py"
timeout = 30.0
test-command = "uv run pytest -q tests/test_client.py tests/test_server.py tests/test_new_tools.py"
excluded-modules = []

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.line-filter.lines]
"src/librus_client.py" = ["180-231", "636-643", "653-666", "687-739", "756-768", "803-818", "913-936", "1063-1087"]

[cosmic-ray.filters.operators-filter]
exclude-operators = [
    "^(?!core/(ReplaceComparisonOperator_.*|ReplaceTrueWithFalse|ReplaceFalseWithTrue|ReplaceAndWithOr|ReplaceOrWithAnd|AddNot|ExceptionReplacer|NumberReplacer|ZeroIterationForLoop)$).*",
]
