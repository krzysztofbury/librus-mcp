version: 2
updates:
  # Python dependencies are intentionally not listed. The fixed `exclude-newer`
  # quarantine cutoff in pyproject.toml rejects any version published after it,
  # so pinned-version bumps cannot lock. They are updated by moving the cutoff,
  # and the scheduled dependency-drift workflow reports breaking releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
