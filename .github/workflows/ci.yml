name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, test, and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f" # pragma: allowlist secret - public artifact checksum

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Set up Python and install dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff check
        run: uv run ruff check src/librus_mcp/ tests_native/ release_verification/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/librus_mcp/ tests_native/ release_verification/ scripts/

      - name: Bandit security check
        run: uv run bandit -c pyproject.toml -r src/librus_mcp/

      - name: Strict consumer typing
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build --no-build-isolation

  compatibility:
    name: Installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The pinned action validates each platform-specific artifact against its manifest.
          version: "0.13.5"

      - name: Set up Python and install dependencies
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14

      - name: Build package
        run: uv build --no-build-isolation

      - name: Verify installed wheel and MCP stdio
        run: |
          uv run python -m release_verification.verify_sdist --sdist dist --out-dir dist/from-sdist
          uv run python release_verification/verify_wheel.py dist/from-sdist --consumer-tests
