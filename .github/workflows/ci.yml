name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint, test, and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Set up Python and install dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff check
        run: uv run ruff check src/ tests/ release_verification/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ release_verification/

      - name: Bandit security check
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build --no-build-isolation
