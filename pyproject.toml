[project]
name = "librus-mcp"
version = "2.0.0.dev1"
description = "MCP server for Librus Synergia using the independent librus-python-api"
authors = [{name = "Krzysztof Bury", email = "contact@datacraze.io"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["mcp", "librus", "synergia", "gradebook", "llm", "claude", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# mcp 2.x is required: the 1.x FastMCP entry point this server was built on was
# renamed to MCPServer in mcp.server.mcpserver, so 1.x and 2.x are not
# interchangeable here.
dependencies = [
    "mcp>=2.1.1,<3",
    "librus-python-api==1.0.0",
    "pydantic>=2.12,<3",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/krzysztofbury/librus-mcp"
Repository = "https://github.com/krzysztofbury/librus-mcp"
Issues = "https://github.com/krzysztofbury/librus-mcp/issues"

[project.scripts]
librus-mcp = "librus_mcp.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librus_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src/librus_mcp", "tests_native", "release_verification", "scripts/qualify_native.py", "pyproject.toml", "uv.lock", "README.md", "CHANGELOG.md", "LICENSE", "MCP_2_0_PLAN.md", "MIGRATION_2_0.md", "NATIVE_TEST_PLAN.md"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "bandit[toml]>=1.8.0",
    "cosmic-ray>=8.7,<9",
    "hatchling==1.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.19,<3",
]

[tool.uv]
# Fixed supply-chain quarantine cutoff, pinned at the project level so local
# resolution (with a global rolling "30 days" exclude-newer) and CI (with no
# global config) produce byte-identical lockfiles. Bump when updating deps.
exclude-newer = "2026-09-01T00:00:00Z"
# Admit the reviewed stable native release and its Windows runtime prerequisites
# without relaxing the quarantine for unrelated dependencies.
exclude-newer-package = { librus-python-api = "2026-10-06T00:00:00Z", pywin32 = "2026-10-06T00:00:00Z", tzdata = "2026-10-06T00:00:00Z", mypy = "2026-10-06T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Keep the selection explicit so upgrading ruff cannot silently change CI. The
# focused rules below are the useful subset adopted from ruff 0.16's expanded
# defaults; broad family selection would also enable high-churn style rules.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM117",
    "RUF012",
    "TRY004",
    "DTZ005",
    "DTZ007",
    "UP006",
    "UP035",
    "UP041",
    "UP045",
    "PYI036",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# The manual smoke test reports each subsystem failure and continues so one
# upstream exception does not hide the health of all remaining subsystems.
"verify_connection.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests_native"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/librus_mcp"]
mypy_path = "src"
explicit_package_bases = true

[tool.bandit]
exclude_dirs = [".venv", "venv", "__pycache__"]
# B101: assert used intentionally for input validation.
skips = ["B101"]
