[project]
name = "librus-mcp"
version = "0.5.2"
description = "MCP server for Librus Synergia — access grades, messages, attendance, homework, timetables, and announcements from AI assistants"
authors = [{name = "Krzysztof Bury", email = "contact@datacraze.io"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "librus", "synergia", "gradebook", "llm", "claude", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Upper bounds: uvx users always resolve the newest allowed versions, so an
# unreviewed upstream major release must not reach them silently.
dependencies = [
    "mcp>=1.25.0,<2",
    "librus-apix>=1.5.1,<2",
    "pydantic>=2.7,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/krzysztofbury/librus-mcp"
Repository = "https://github.com/krzysztofbury/librus-mcp"
Issues = "https://github.com/krzysztofbury/librus-mcp/issues"

[project.scripts]
librus-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["ruff>=0.11.0", "bandit[toml]>=1.8.0", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
# Fixed supply-chain quarantine cutoff, pinned at the project level so local
# resolution (with a global rolling "30 days" exclude-newer) and CI (with no
# global config) produce byte-identical lockfiles. Bump when updating deps.
exclude-newer = "2026-06-14T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.bandit]
exclude_dirs = [".venv", "venv", "__pycache__"]
# B101: assert used intentionally for input validation.
skips = ["B101"]
