[project]
name = "librus-mcp"
version = "1.0.1"
description = "MCP server for Librus Synergia — access grades, messages, attendance, homework, timetables, and announcements from AI assistants"
authors = [{name = "Krzysztof Bury", email = "contact@datacraze.io"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
keywords = ["mcp", "librus", "synergia", "gradebook", "llm", "claude", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# librus-apix exposes no public timeout/session hook; pin the release whose
# private Client._session behavior is covered by this server's tests.
#
# Lower bounds on mcp, lxml, requests, and aiohttp are the first patched
# releases for published advisories. This server is stdio-only and uses aiohttp
# purely as a client, so none of those advisories are reachable here, but the
# floors keep a resolver from selecting an affected version for an installed
# copy of this package.
dependencies = [
    "mcp>=1.28.1,<2",
    "librus-apix==1.5.1",
    "pydantic>=2.7,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=6.1.0,<7",
    "requests>=2.33.0,<3",
    "aiohttp>=3.14.2,<4",
    "yarl>=1.20,<2",
]

[project.urls]
Homepage = "https://github.com/krzysztofbury/librus-mcp"
Repository = "https://github.com/krzysztofbury/librus-mcp"
Issues = "https://github.com/krzysztofbury/librus-mcp/issues"

[project.scripts]
librus-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["ruff>=0.11.0", "bandit[toml]>=1.8.0", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
# Fixed supply-chain quarantine cutoff, pinned at the project level so local
# resolution (with a global rolling "30 days" exclude-newer) and CI (with no
# global config) produce byte-identical lockfiles. Bump when updating deps.
exclude-newer = "2026-09-01T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# ruff 0.16 widened its implicit default rule set (adding I, SIM, RUF, TRY, DTZ,
# UP, PYI, and BLE), so an unpinned upgrade silently changes what CI enforces.
# State the set explicitly: this is the selection that was in effect through
# 0.15.x. Adopting the wider set is a separate change, tracked in TODO.md.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.bandit]
exclude_dirs = [".venv", "venv", "__pycache__"]
# B101: assert used intentionally for input validation.
skips = ["B101"]
