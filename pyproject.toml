[project]
name = "librus-mcp"
version = "1.2.0"
description = "MCP server for Librus Synergia — access grades, messages, attendance, homework, timetables, and announcements from AI assistants"
authors = [{name = "Krzysztof Bury", email = "contact@datacraze.io"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
keywords = ["mcp", "librus", "synergia", "gradebook", "llm", "claude", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# librus-apix exposes no public timeout/session hook; pin the release whose
# private Client._session behavior is covered by this server's tests.
#
# mcp 2.x is required: the 1.x FastMCP entry point this server was built on was
# renamed to MCPServer in mcp.server.mcpserver, so 1.x and 2.x are not
# interchangeable here.
#
# Lower bounds on lxml, requests, and aiohttp are the first patched releases for
# published advisories. This server is stdio-only and uses aiohttp purely as a
# client, so none of those advisories are reachable here, but the floors keep a
# resolver from selecting an affected version for an installed copy of this
# package.
dependencies = [
    "mcp>=2.1.1,<3",
    "librus-apix==1.5.1",
    "pydantic>=2.7,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=6.1.0,<7",
    "requests>=2.33.0,<3",
    "aiohttp>=3.14.2,<4",
    "yarl>=1.20,<2",
]

[project.urls]
Homepage = "https://github.com/krzysztofbury/librus-mcp"
Repository = "https://github.com/krzysztofbury/librus-mcp"
Issues = "https://github.com/krzysztofbury/librus-mcp/issues"

[project.scripts]
librus-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["ruff>=0.11.0", "bandit[toml]>=1.8.0", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
# Fixed supply-chain quarantine cutoff, pinned at the project level so local
# resolution (with a global rolling "30 days" exclude-newer) and CI (with no
# global config) produce byte-identical lockfiles. Bump when updating deps.
exclude-newer = "2026-09-01T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Keep the selection explicit so upgrading ruff cannot silently change CI. The
# focused rules below are the useful subset adopted from ruff 0.16's expanded
# defaults; broad family selection would also enable high-churn style rules.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM117",
    "RUF012",
    "TRY004",
    "DTZ005",
    "DTZ007",
    "UP006",
    "UP035",
    "UP041",
    "UP045",
    "PYI036",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# The manual smoke test reports each subsystem failure and continues so one
# upstream exception does not hide the health of all remaining subsystems.
"verify_connection.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.bandit]
exclude_dirs = [".venv", "venv", "__pycache__"]
# B101: assert used intentionally for input validation.
skips = ["B101"]
